services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-philips_agent}
      POSTGRES_USER: ${POSTGRES_USER:-philips_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEVICE: cpu
      VECTOR_DB: data/vector_db
      DATA_DIRECTORY: data/users
      LOG_DIR: logs
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # Uses a locally running Ollama instance by default. Override OLLAMA_HOST
      # in .env when using a remote Ollama server.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      # Persist the FAISS index, uploaded manuals, and structured JSON logs.
      - ./data/vector_db:/app/data/vector_db
      - ./data/users:/app/data/users
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:

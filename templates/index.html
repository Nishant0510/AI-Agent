<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name | default('Philips Product Knowledge AI Agent') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand mb-0 h1 text-decoration-none" href="/chat">Philips Product Knowledge</a>
        <div class="d-flex align-items-center gap-3">
            <span id="health-indicator" class="badge bg-secondary">checking…</span>
            <span id="signed-in-user" class="text-white small"></span>
            <button id="logout-btn" class="btn btn-sm btn-outline-light">Sign out</button>
        </div>
    </nav>
    <div id="service-banner" class="alert alert-danger d-none rounded-0 mb-0" role="alert">
        <span id="service-banner-message">The answer service is unavailable. Try again later.</span>
        <button type="button" class="btn-close float-end" id="service-banner-close" aria-label="Close"></button>
    </div>

    <div class="container-fluid mt-3">
        <div class="row g-3">
            <aside class="col-lg-3 col-xl-2">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Your chats</span>
                        <button id="new-chat-btn" class="btn btn-sm btn-outline-primary">New</button>
                    </div>
                    <div id="conversation-list" class="list-group list-group-flush conversation-list"></div>
                </div>
            </aside>

            <main class="col-lg-6 col-xl-7">
                <div class="card mb-3">
                    <div class="card-header">Chat</div>
                    <div class="card-body">
                        <div id="chat-window" class="chat-window mb-3"></div>
                        <form id="ask-form" class="d-flex gap-2">
                            <input id="question-input" type="text" class="form-control"
                                   placeholder="Ask a question about Philips products…" maxlength="2000" required>
                            <button type="submit" class="btn btn-primary" id="ask-submit-btn">Ask</button>
                        </form>
                    </div>
                </div>
                <section id="upload-card" class="card mb-3" hidden>
                    <div class="card-header">Admin · Upload a manual</div>
                    <div class="card-body">
                        <form id="upload-form" class="d-flex gap-2 align-items-center">
                            <input id="file-input" type="file" class="form-control" accept="application/pdf" required>
                            <button type="submit" class="btn btn-outline-primary text-nowrap" id="upload-submit-btn">Upload</button>
                        </form>
                        <div id="upload-status" class="form-text mt-2"></div>
                    </div>
                </section>
            </main>

            <aside class="col-lg-3">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Knowledge sources</span>
                        <button id="refresh-sources-btn" class="btn btn-sm btn-outline-secondary">Refresh</button>
                    </div>
                    <div class="card-body"><div id="sources-panel"><p class="text-muted mb-0">Loading sources…</p></div></div>
                </div>
            </aside>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/sources.js') }}"></script>
    <script src="{{ url_for('static', path='js/upload.js') }}"></script>
    <script src="{{ url_for('static', path='js/chat.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name | default('Philips Product Knowledge AI Agent') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">🏥 Philips Product Knowledge AI Agent</span>
        <span id="health-indicator" class="badge bg-secondary">checking…</span>
    </nav>

    <div id="service-banner" class="alert alert-danger d-none rounded-0 mb-0" role="alert">
        <strong>Service unavailable:</strong> The answer engine isn't wired up yet. Try again later.
        <button type="button" class="btn-close float-end" id="service-banner-close" aria-label="Close"></button>
    </div>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Chat column -->
            <div class="col-lg-8">
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Chat</span>
                        <button id="clear-history-btn" class="btn btn-sm btn-outline-secondary">Clear history</button>
                    </div>
                    <div class="card-body">
                        <div id="chat-window" class="chat-window mb-3"></div>
                        <form id="ask-form" class="d-flex gap-2">
                            <input
                                id="question-input"
                                type="text"
                                class="form-control"
                                placeholder="Ask a question about your Philips product manuals…"
                                maxlength="2000"
                                required
                            >
                            <button type="submit" class="btn btn-primary" id="ask-submit-btn">Ask</button>
                        </form>
                    </div>
                </div>

                <!-- Upload widget -->
                <div class="card mb-3">
                    <div class="card-header">Upload a manual</div>
                    <div class="card-body">
                        <form id="upload-form" class="d-flex gap-2 align-items-center">
                            <input id="file-input" type="file" class="form-control" accept="application/pdf" required>
                            <button type="submit" class="btn btn-outline-primary text-nowrap" id="upload-submit-btn">Upload</button>
                        </form>
                        <div id="upload-status" class="form-text mt-2"></div>
                    </div>
                </div>
            </div>

            <!-- Source panel -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Sources</span>
                        <button id="refresh-sources-btn" class="btn btn-sm btn-outline-secondary">Refresh</button>
                    </div>
                    <div class="card-body">
                        <div id="sources-panel">
                            <p class="text-muted mb-0">Loading sources…</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/sources.js') }}"></script>
    <script src="{{ url_for('static', path='js/upload.js') }}"></script>
    <script src="{{ url_for('static', path='js/chat.js') }}"></script>
</body>
</html>

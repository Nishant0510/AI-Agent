<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · Philips Product Knowledge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card card shadow-sm" data-auth-mode="signup">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Create your account</h1>
            <p class="text-muted mb-4">Your chat history is saved to your account.</p>
            <div id="auth-error" class="alert alert-danger d-none" role="alert"></div>
            <form id="auth-form">
                <label class="form-label" for="email">Email</label>
                <input class="form-control mb-3" id="email" name="email" type="text" inputmode="email" autocomplete="username" required maxlength="254">
                <label class="form-label" for="password">Password</label>
                <input class="form-control mb-4" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
                <button class="btn btn-primary w-100" type="submit" id="auth-submit">Create account</button>
            </form>
            <p class="small text-center mt-4 mb-0">Already registered? <a href="/login">Sign in</a></p>
        </div>
    </main>
    <script src="{{ url_for('static', path='js/auth.js') }}"></script>
</body>
</html>
